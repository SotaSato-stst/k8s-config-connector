apiVersion: bigtable.cnrm.cloud.google.com/v1alpha1
kind: BigtableAuthorizedView
metadata:
  name: authorizedview-${uniqueId}
spec:
  tableRef:
    name: authorizedview-dep-${uniqueId}
  subsetView:
    rowPrefixes:
    - cHJlZml4MQ== # base64 encoded "prefix1"
    - cHJlZml4Mg== # base64 encoded "prefix2"
    familySubsets:
      col-family1:
        qualifiers:
        - cXVhbDEK # base64 encoded "qual1\n"
        - cXVhbDIK # base64 encoded "qual2\n"
        qualifierPrefixes:
        - cXVhbC0= # base64 encoded "qual-"
      col-family2:
        qualifierPrefixes:
        - # empty string gives access to all qualifiers
  deletionProtection: true