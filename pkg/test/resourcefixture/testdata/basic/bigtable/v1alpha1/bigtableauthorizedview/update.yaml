apiVersion: bigtable.cnrm.cloud.google.com/v1alpha1
kind: BigtableAuthorizedView
metadata:
  name: authorizedview-${uniqueId}
spec:
  tableRef:
    name: authorizedview-dep-${uniqueId}
  subsetView:
    rowPrefixes:
    - cHJlZml4MQ== # base64 encoded "prefix1"
    - cHJlZml4Mw== # base64 encoded "prefix3" (changed from prefix2)
    - cHJlZml4NA== # base64 encoded "prefix4" (added)
    familySubsets:
      col-family1:
        qualifiers:
        - cXVhbDMK # base64 encoded "qual3\n" (changed)
        qualifierPrefixes:
        - cXVhbC0= # base64 encoded "qual-"
        - cHJlZml4LQ== # base64 encoded "prefix-" (added)
      col-family2:
        qualifiers:
        - cXVhbDQK # base64 encoded "qual4\n" (added)
        qualifierPrefixes:
        - cXVhbDUtCg== # base64 encoded "qual5-\n" (changed from empty)
  deletionProtection: false # changed from true